name: NuGet Generation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and publish NuGet package

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Synchronize project and package version
        shell: bash
        run: |
          BASE_VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' MythosSoftware.FastMap/MythosSoftware.FastMap.csproj)
          VERSION_PREFIX=$(echo "$BASE_VERSION" | cut -d. -f1,2)
          PACKAGE_VERSION="${VERSION_PREFIX}.${GITHUB_RUN_NUMBER}"

          PACKAGE_VERSION="$PACKAGE_VERSION" python3 - <<'PYTHON'
          import os
          import re
          from pathlib import Path
          import xml.etree.ElementTree as ET

          project = Path("MythosSoftware.FastMap/MythosSoftware.FastMap.csproj")
          content = project.read_text()
          updated, count = re.subn(
              r"(<Version>)[^<]*(</Version>)",
              lambda match: match[1] + os.environ["PACKAGE_VERSION"] + match[2],
              content,
          )
          if count != 1:
              raise SystemExit("Expected exactly one <Version> element in the project file")
          ET.fromstring(updated)
          project.write_text(updated)
          PYTHON

          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "Project and package version: $PACKAGE_VERSION"

      - name: Restore dependencies
        run: dotnet restore MythosSoftware.FastMap/MythosSoftware.FastMap.csproj

      - name: Build
        run: >
          dotnet build
          MythosSoftware.FastMap/MythosSoftware.FastMap.csproj
          --configuration Release
          --no-restore

      - name: Clean package output
        run: rm -rf out

      - name: Generate NuGet package
        shell: bash
        run: |
          dotnet pack \
            MythosSoftware.FastMap/MythosSoftware.FastMap.csproj \
            --configuration Release \
            --no-build \
            --output out \
            -p:PackageVersion="$PACKAGE_VERSION"

      - name: Display generated packages
        run: |
          echo "Generated NuGet packages:"
          ls -lah out/

      - name: Publish to NuGet
        run: >
          dotnet nuget push "out/*.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --skip-duplicate

      - name: Commit and push project version
        shell: bash
        run: |
          PROJECT_FILE="MythosSoftware.FastMap/MythosSoftware.FastMap.csproj"

          if git diff --quiet -- "$PROJECT_FILE"; then
            echo "Project version is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$PROJECT_FILE"
          git commit -m "chore: set project version to $PACKAGE_VERSION [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
