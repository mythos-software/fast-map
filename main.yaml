name: NuGet Generation

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and publish NuGet package

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MythosSoftware.FastMap/MythosSoftware.FastMap.csproj

      - name: Build
        run: >
          dotnet build
          MythosSoftware.FastMap/MythosSoftware.FastMap.csproj
          --configuration Release
          --no-restore

      - name: Create NuGet package
        shell: bash
        run: |
          BASE_VERSION=$(grep -oPm1 '(?<=<Version>)[^<]+' MythosSoftware.FastMap/MythosSoftware.FastMap.csproj)
          VERSION_PREFIX=$(echo "$BASE_VERSION" | cut -d. -f1,2)
          PACKAGE_VERSION="${VERSION_PREFIX}.${GITHUB_RUN_NUMBER}"

          echo "Base version: $BASE_VERSION"
          echo "Package version: $PACKAGE_VERSION"

          dotnet pack \
            MythosSoftware.FastMap/MythosSoftware.FastMap.csproj \
            --configuration Release \
            --no-build \
            --output out \
            -p:PackageVersion="$PACKAGE_VERSION"

      - name: Display packages
        run: ls -lah out/

      - name: Publish to NuGet
        run: >
          dotnet nuget push "out/*.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --skip-duplicate